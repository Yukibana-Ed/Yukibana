version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The same age as pnpm's minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 14
    groups:
      # Theia's version check fails on any mix of @theia/* versions.
      theia:
        patterns: ['@theia/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # Theia pins the Electron version as a peer dependency of @theia/electron.
      - dependency-name: electron
      # The ts6 catalog stays on TypeScript 6 for svelte-check; the default catalog's major is bumped by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
