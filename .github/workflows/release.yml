# Releases one package, by hand: Actions, Release, Run workflow, with the tag to make, `client-v<version>`,
# `cli-v<version>` or `ide-v<version>`, from the branch chosen in "Use workflow from" (main to publish). The client and
# the CLI go to npm, the IDE's installers for Windows, Linux and macOS (arm64 and x64) to a GitHub release; only the IDE
# gets a GitHub release. The versions in git stay 0.0.0-dev: the run writes the version into the package's manifest
# before it builds, so the tag is the only place a version is chosen.
#
# `.github/scripts/release-tag.mts` checks the tag first: its shape, that it does not exist yet, and that the version is
# higher than the package's newest release. Then the package is built and smoke-tested (the npm tarball installed into
# an empty folder and run, or the installers built on each OS). Nothing is published and no tag is made unless all of
# that passed: the publish job needs every build, publishes, and only then tags. The client's and the CLI's tag is made on
# the commit the run built, right after the npm publish; the IDE's by publishing its GitHub release, a draft until every
# installer is attached. If tagging fails after an npm publish, re-running the failed jobs of that run tags it (the
# version on npm is left alone).
#
# From any branch but main, or in a fork, a run is a dry run: it checks, builds and smoke-tests everything, and publishes
# and tags nothing, leaving the files as the run's artifacts.
#
# npm publishing uses trusted publishing (OIDC), with no token: @yukibana/client and @yukibana/cli each name this
# repository, workflow release.yml and environment `release` as their trusted publisher on npmjs.com (Settings of each
# package), and pnpm exchanges the job's GitHub OIDC token for a one-time publish token, which also signs each version's
# provenance. Renaming this file, the environment or the repository breaks publishing until those settings follow. The
# `release` environment (Settings, Environments) holds no secrets; it is where a required reviewer and the rule that only
# main may deploy go. The GitHub release uses the job's own token.
name: Release
run-name: ${{ format('Release {0}{1}', inputs.tag, (github.ref != 'refs/heads/main' || github.repository != 'Yukibana-Ed/Yukibana') && format(' (dry run of {0})', github.ref_name) || '') }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release, as its tag: client-vX.Y.Z, cli-vX.Y.Z or ide-vX.Y.Z'
        required: true
        type: string

# One release at a time, and none cancelled halfway: a publish stopped between npm and the tag is finished by re-running
# it, but there is no reason to make it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.check.outputs.kind }}
      version: ${{ steps.check.outputs.version }}
      name: ${{ steps.check.outputs.name }}
      dir: ${{ steps.check.outputs.dir }}
      publish: ${{ github.ref == 'refs/heads/main' && github.repository == 'Yukibana-Ed/Yukibana' }}
    steps:
      # With the tags, which say what is released.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Check
        id: check
        run: node .github/scripts/release-tag.mts
        env:
          RELEASE_TAG: ${{ inputs.tag }}

  npm:
    name: Build and smoke-test ${{ needs.check.outputs.name }}
    needs: check
    if: needs.check.outputs.kind == 'client' || needs.check.outputs.kind == 'cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # Before the install, whose prepare scripts build the packages.
      - name: Set the version
        run: node -e 'const fs = require("fs"); const f = process.argv[1]; const m = JSON.parse(fs.readFileSync(f, "utf8")); m.version = process.argv[2]; fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n");' "$DIR/package.json" "$VERSION"
        env:
          DIR: ${{ needs.check.outputs.dir }}
          VERSION: ${{ needs.check.outputs.version }}

      # The CLI and what it uses (the client among them); each package's prepare script compiles it into lib/.
      - name: Install and build
        run: pnpm --filter @yukibana/cli... install --frozen-lockfile --fetch-timeout 100000

      # pnpm writes the versions that catalog: stands for into the packed manifest, so this tarball is exactly what the
      # registry gets.
      - name: Pack
        run: pnpm --dir "$DIR" pack --pack-destination "$RUNNER_TEMP/packs"
        env:
          DIR: ${{ needs.check.outputs.dir }}

      # Installed from the tarball alone, outside the workspace, the way someone installs it from npm: no catalog:,
      # nothing missing from `files`. The CLI runs without the client beside it, on a course repository as git archive
      # makes it.
      - name: Smoke test
        working-directory: ${{ runner.temp }}
        env:
          KIND: ${{ needs.check.outputs.kind }}
        run: |
          set -euo pipefail
          if tar -xOzf packs/*.tgz package/package.json | grep -E '"(workspace|catalog):'; then
            echo "::error::The tarball still has a workspace: or catalog: dependency in its manifest."
            exit 1
          fi
          mkdir smoke repo
          tar -xzf "$GITHUB_WORKSPACE/packages/fixtures/repo.tar.gz" -C repo --strip-components=1
          cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packs/*.tgz
          if [ "$KIND" = cli ]; then
            test ! -e node_modules/@yukibana/client
            npx --no-install yukibana --help > /dev/null
            npx --no-install yukibana check ../repo
            npx --no-install yukibana build ../repo --out ../built
            test -s ../built/starter.tar.gz && test -s ../built/teacher.tar.gz
          else
            node --input-type=module -e "import('@yukibana/client').then(m => { if (Object.keys(m).length === 0) process.exit(1); })"
          fi

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/packs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
  ide:
    name: Build the IDE (${{ matrix.artifact }})
    needs: check
    if: needs.check.outputs.kind == 'ide'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # The IDE and what it uses, as `pnpm setup:ide` installs it: not the cloud's Supabase CLI, squawk or workerd.
      - name: Install dependencies
        shell: bash
        run: pnpm --filter "{ide/**}..." install --frozen-lockfile --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm -C ide download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      # electron-builder names the installers and writes latest.yml with this version, and it is the version the packaged
      # app reports (About, the updater), which reads it from this manifest.
      - name: Set the version
        shell: bash
        run: node -e 'const fs = require("fs"); const f = process.argv[1]; const m = JSON.parse(fs.readFileSync(f, "utf8")); m.version = process.argv[2]; fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n");' ide/electron/package.json "$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}

      - name: Build the installers
        shell: bash
        run: pnpm -C ide package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers, their blockmaps (which let an updater download only the blocks that changed since the version it
      # has) and the Windows and Linux update feeds. macOS's arm64 and x64 builds each write a latest-mac.yml of the same
      # name, so neither goes up until they are merged; an unsigned Mac cannot install updates anyway (issue #91).
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: ide-${{ matrix.artifact }}
          path: |
            ide/electron/dist/*.exe
            ide/electron/dist/*.dmg
            ide/electron/dist/*.zip
            ide/electron/dist/*.AppImage
            ide/electron/dist/*.deb
            ide/electron/dist/*.blockmap
            ide/electron/dist/latest.yml
            ide/electron/dist/latest-linux.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [check, npm, ide]
    # Only from main of this repository, and only once the check and the package's builds all passed; the build of the
    # other kind is skipped, which is not a failure.
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.check.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      # The tag and the GitHub release.
      contents: write
      # npm's trusted publishing and provenance.
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Download the tarball
        if: needs.check.outputs.kind != 'ide'
        uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/packs

      # The tarball the smoke test installed; then its tag, on the commit it was built from. A version already on npm (a
      # re-run after the tag failed) is not published again, and a tag already on this commit is fine; one on another
      # commit fails, since tags are never moved. Published from outside the workspace, whose devEngines would otherwise
      # have to match this job's Node exactly.
      - name: Publish to npm and tag
        if: needs.check.outputs.kind != 'ide'
        working-directory: ${{ runner.temp }}
        env:
          NAME: ${{ needs.check.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2f}/$VERSION")" = 200 ]; then
            echo "$NAME $VERSION is already on npm."
          else
            pnpm publish packs/*.tgz --access public --provenance --no-git-checks
          fi
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null); then
            if [ "$existing" != "$COMMIT" ]; then
              echo "::error::$TAG is on $existing, not $COMMIT; tags are never moved."
              exit 1
            fi
            echo "$TAG is already on $COMMIT."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
            echo "Tagged $COMMIT as $TAG."
          fi

      - name: Download the installers
        if: needs.check.outputs.kind == 'ide'
        uses: actions/download-artifact@v8
        with:
          pattern: ide-*
          merge-multiple: true
          path: ${{ runner.temp }}/installers

      # A draft first, published once every installer is attached, so nobody downloads from a half-made release.
      # Publishing it creates the tag on the commit built and marks it latest, which is where installed IDEs look for
      # updates. A draft left by an earlier run that failed is reused, retargeted at this commit; a release already
      # published is never touched.
      - name: Publish the GitHub release
        if: needs.check.outputs.kind == 'ide'
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = false ]; then
              echo "::error::$TAG is already published."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$COMMIT" --title "Yukibana IDE $VERSION" --generate-notes
          fi
          gh release upload "$TAG" --clobber "$RUNNER_TEMP"/installers/*
          gh release edit "$TAG" --draft=false --latest --target "$COMMIT"
