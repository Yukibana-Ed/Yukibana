# Releases what a push to main bumped: @yukibana/client and @yukibana/cli to npm, and the IDE's installers for Windows,
# Linux and macOS (arm64 and x64) to a GitHub release tagged ide-v<version>. Releasing is a pull request that changes
# the version in a package.json from 0.0.0-dev, or from the version last released, to a higher X.Y.Z; nothing else
# releases, and nothing is ever published by hand. `.github/scripts/release-plan.mts` decides what each push releases
# from git and from what is already out, so a push that bumps nothing releases nothing, and a run that failed halfway is
# finished by re-running it or by the next push to main. Each package has its own version and releases on its own: the
# CLI bundles the client it was built with, so a CLI release needs no client release.
#
# Only commits on main are released, and main moves only by merging a pull request whose CI passed (deploy-cloud.yml
# says why that is enough), so the tests do not run again here. What runs here is what CI does not do: the npm tarballs
# are packed, installed into an empty folder and run, and the installers are built on each OS. Nothing becomes public
# until every build passed: the publish job needs them all, and publishes npm before the GitHub release.
#
# Every release is a tag on the commit it was built from, made only once every build and smoke test passed and the
# package is out: client-v<version> and cli-v<version> right after their npm publish, ide-v<version> by publishing the
# IDE's GitHub release (a draft until all its installers are attached). Only the IDE gets a GitHub release. A tag is
# never moved or made again; an npm version left without its tag gets it from the next run, on the commit npm's
# provenance names.
#
# Run by hand (workflow_dispatch, from any branch) it is a dry run: it packs, smoke-tests and builds everything at the
# versions in git and publishes and tags nothing, leaving the files as the run's artifacts.
#
# npm publishing uses trusted publishing (OIDC), with no token: @yukibana/client and @yukibana/cli each name this
# repository, workflow release.yml and environment `release` as their trusted publisher on npmjs.com (Settings of each
# package), and pnpm exchanges the job's GitHub OIDC token for a one-time publish token, which also signs each version's
# provenance. Renaming this file, the environment or the repository breaks publishing until those settings follow. The
# `release` environment (Settings, Environments) holds no secrets; it is where a required reviewer or a branch rule for
# releases goes. The GitHub release uses the job's own token.
name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release dry run of {0}', github.ref_name) || format('Release {0}', github.sha) }}

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and none cancelled halfway: a publish stopped between npm and GitHub would leave the next run
# to finish it, which it does, but there is no reason to make it.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # Not in a fork, whose main may carry a version bump without the tags that say it is out (syncing a fork copies no
    # tags), unless run by hand as a dry run.
    if: github.repository == 'Yukibana-Ed/Yukibana' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      npm: ${{ steps.plan.outputs.npm }}
      client: ${{ steps.plan.outputs.client }}
      client-version: ${{ steps.plan.outputs.client-version }}
      cli: ${{ steps.plan.outputs.cli }}
      cli-version: ${{ steps.plan.outputs.cli-version }}
      ide: ${{ steps.plan.outputs.ide }}
      ide-version: ${{ steps.plan.outputs.ide-version }}
      tags: ${{ steps.plan.outputs.tags }}
      client-tag: ${{ steps.plan.outputs.client-tag }}
      client-tag-commit: ${{ steps.plan.outputs.client-tag-commit }}
      cli-tag: ${{ steps.plan.outputs.cli-tag }}
      cli-tag-commit: ${{ steps.plan.outputs.cli-tag-commit }}
    steps:
      # With the tags, which say which IDE versions are out and which npm versions are tagged.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Plan
        id: plan
        run: node .github/scripts/release-plan.mts

  npm:
    name: Pack and smoke-test the npm packages
    needs: plan
    if: needs.plan.outputs.npm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # The CLI and what it uses; each package's prepare script compiles it into lib/.
      - name: Install and build
        run: pnpm --filter @yukibana/cli... install --frozen-lockfile --fetch-timeout 100000

      # pnpm writes the versions that catalog: and workspace:* stand for into the packed manifests, so these tarballs are
      # exactly what the registry gets.
      - name: Pack
        run: pnpm -r --filter @yukibana/client --filter @yukibana/cli pack --pack-destination "$RUNNER_TEMP/packs"

      # Installed from the tarballs alone, outside the workspace, the way someone installs them from npm: no
      # workspace:, no catalog:, nothing missing from `files`. Each in a folder of its own, so the CLI shows that it runs
      # without the client installed beside it. The fixture is a course repository as git archive makes it.
      - name: Smoke test
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir cli library repo
          tar -xzf "$GITHUB_WORKSPACE/packages/fixtures/repo.tar.gz" -C repo --strip-components=1
          for t in packs/*.tgz; do
            if tar -xOzf "$t" package/package.json | grep -E '"(workspace|catalog):'; then
              echo "::error::$t still has a workspace: or catalog: dependency in its manifest."
              exit 1
            fi
          done
          (
            cd cli
            npm init -y > /dev/null
            npm install --no-audit --no-fund ../packs/yukibana-cli-*.tgz
            test ! -e node_modules/@yukibana/client
            npx --no-install yukibana --help > /dev/null
            npx --no-install yukibana check ../repo
            npx --no-install yukibana build ../repo --out ../built
            test -s ../built/starter.tar.gz && test -s ../built/teacher.tar.gz
          )
          (
            cd library
            npm init -y > /dev/null
            npm install --no-audit --no-fund ../packs/yukibana-client-*.tgz
            node --input-type=module -e "import('@yukibana/client').then(m => { if (Object.keys(m).length === 0) process.exit(1); })"
          )

      - name: Upload the tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/packs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
  ide:
    name: Build the IDE (${{ matrix.artifact }})
    needs: plan
    if: needs.plan.outputs.ide == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # The IDE and what it uses, as `pnpm setup:ide` installs it: not the cloud's Supabase CLI, squawk or workerd.
      - name: Install dependencies
        shell: bash
        run: pnpm --filter "{ide/**}..." install --frozen-lockfile --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm -C ide download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      # electron-builder takes the app's version from ide/electron/package.json, which is the version released.
      - name: Build the installers
        shell: bash
        run: pnpm -C ide package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers, their blockmaps (which let an updater download only the blocks that changed since the version it
      # has) and the Windows and Linux update feeds. macOS's arm64 and x64 builds each write a latest-mac.yml of the same
      # name, so neither goes up until they are merged; an unsigned Mac cannot install updates anyway (issue #91).
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: ide-${{ matrix.artifact }}
          path: |
            ide/electron/dist/*.exe
            ide/electron/dist/*.dmg
            ide/electron/dist/*.zip
            ide/electron/dist/*.AppImage
            ide/electron/dist/*.deb
            ide/electron/dist/*.blockmap
            ide/electron/dist/latest.yml
            ide/electron/dist/latest-linux.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, npm, ide]
    # On a push to main of this repository only (a fork has no release environment), once every build it needs passed;
    # a build the plan did not need is skipped, which is not a failure.
    if: >-
      !cancelled() && github.event_name == 'push' && github.repository == 'Yukibana-Ed/Yukibana' &&
      (needs.plan.outputs.npm == 'true' || needs.plan.outputs.ide == 'true' || needs.plan.outputs.tags == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      # The GitHub release and its tag.
      contents: write
      # npm's trusted publishing and provenance.
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Download the tarballs
        if: needs.plan.outputs.npm == 'true'
        uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/packs

      # The tarballs the smoke test installed. A version
      # already on the registry is left alone, so a re-run after a failure publishes only what is missing. Published from
      # outside the workspace, whose devEngines would otherwise have to match this job's Node exactly.
      - name: Publish to npm
        if: needs.plan.outputs.npm == 'true'
        working-directory: ${{ runner.temp }}
        env:
          CLIENT: ${{ needs.plan.outputs.client }}
          CLIENT_VERSION: ${{ needs.plan.outputs.client-version }}
          CLI: ${{ needs.plan.outputs.cli }}
          CLI_VERSION: ${{ needs.plan.outputs.cli-version }}
        run: |
          set -euo pipefail
          publish() { # name, version, tarball
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${1/\//%2f}/$2")" = 200 ]; then
              echo "$1 $2 is already on npm."
              return
            fi
            pnpm publish "$3" --access public --provenance --no-git-checks
          }
          if [ "$CLIENT" = true ]; then publish @yukibana/client "$CLIENT_VERSION" "packs/yukibana-client-$CLIENT_VERSION.tgz"; fi
          if [ "$CLI" = true ]; then publish @yukibana/cli "$CLI_VERSION" "packs/yukibana-cli-$CLI_VERSION.tgz"; fi

      # What was just published, on this commit; and a version out without its tag, on the commit npm's provenance names
      # (the plan found it). A tag that exists on the same commit is fine; one on another commit fails the run, since
      # tags are never moved.
      - name: Tag the npm releases
        if: needs.plan.outputs.tags == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLIENT_TAG: ${{ needs.plan.outputs.client-tag }}
          CLIENT_TAG_COMMIT: ${{ needs.plan.outputs.client-tag-commit }}
          CLIENT_VERSION: ${{ needs.plan.outputs.client-version }}
          CLI_TAG: ${{ needs.plan.outputs.cli-tag }}
          CLI_TAG_COMMIT: ${{ needs.plan.outputs.cli-tag-commit }}
          CLI_VERSION: ${{ needs.plan.outputs.cli-version }}
        run: |
          set -euo pipefail
          tag() { # tag, action (here or recover), commit for recover
            local commit="$COMMIT"
            case "$2" in
              none) return ;;
              recover) commit="$3" ;;
            esac
            if [ -z "$commit" ]; then
              echo "::error::No commit to tag $1 on."
              exit 1
            fi
            if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$1" --jq .object.sha 2> /dev/null); then
              if [ "$existing" = "$commit" ]; then
                echo "$1 is already on $commit."
                return
              fi
              echo "::error::$1 is on $existing, not $commit; tags are never moved."
              exit 1
            fi
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$1" -f sha="$commit" > /dev/null
            echo "Tagged $commit as $1."
          }
          tag "client-v$CLIENT_VERSION" "$CLIENT_TAG" "$CLIENT_TAG_COMMIT"
          tag "cli-v$CLI_VERSION" "$CLI_TAG" "$CLI_TAG_COMMIT"

      - name: Download the installers
        if: needs.plan.outputs.ide == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: ide-*
          merge-multiple: true
          path: ${{ runner.temp }}/installers

      # A draft first, published once every installer is attached, so nobody downloads from a half-made release. The
      # draft of an earlier run that failed is reused, retargeted at this commit. Publishing it creates the tag
      # ide-v<version> on this commit, which is what tells the next plan that this version is out. A release already
      # published is left alone: a re-run of an older run must not replace its files with ones built from another commit.
      - name: Publish the GitHub release
        if: needs.plan.outputs.ide == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.ide-version }}
        run: |
          set -euo pipefail
          tag="ide-v$VERSION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = false ]; then
              echo "The IDE $VERSION is already out ($tag)."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$COMMIT" --title "Yukibana IDE $VERSION" --generate-notes
          fi
          gh release upload "$tag" --clobber "$RUNNER_TEMP"/installers/*
          gh release edit "$tag" --draft=false --latest --target "$COMMIT"
