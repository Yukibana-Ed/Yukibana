# Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
# The IDE's installers, for a version tag or by hand, until the tag-driven release workflow replaces this. A tag is
# pushed on main, whose every commit passed CI in the merge queue, so the tests do not run again here.
name: Package

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.x
          cache: true
          install: false

      # The IDE and what it uses, as `pnpm setup:ide` installs it: not the cloud's Supabase CLI, squawk or workerd.
      - name: Install dependencies
        shell: bash
        run: pnpm --filter "{ide/**}..." install --frozen-lockfile --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      - name: Update electron-builder.yml for macos-15
        if: matrix.os == 'macos-15'
        run: |
          sed -i '' 's|https://yukibana.isc-vs.ch/download/latest/macos|https://yukibana.isc-vs.ch/download/latest/macos-arm|g' ide/electron/electron-builder.yml

      - name: Build prod package
        shell: bash
        run: |
          pnpm package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ide/electron/dist/**
            !ide/electron/dist/*-unpacked/**
            !ide/electron/dist/mac/**
            !ide/electron/dist/mac-arm64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
