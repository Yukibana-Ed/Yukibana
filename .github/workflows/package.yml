# Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
# The IDE's installers, for a version tag or by hand, until the tag-driven release workflow replaces this. Only for a
# commit on main, whose every commit passed CI in the merge queue, so the tests do not run again here. Versions exist
# only in tags: a tag vX.Y.Z packages version X.Y.Z, and a run by hand the 0.0.0-dev that ide/electron/package.json
# holds.
name: Package

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history, for main's.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed on any commit, and a run by hand started from any branch: neither passed the merge queue.
      - name: Refuse a commit that is not on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_SHA is not on main: only a commit that passed CI is packaged."
            exit 1
          fi

      - name: Version from the tag
        id: version
        run: |
          version=0.0.0-dev
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.artifact }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # The IDE and what it uses, as `pnpm setup:ide` installs it: not the cloud's Supabase CLI, squawk or workerd.
      - name: Install dependencies
        shell: bash
        run: pnpm --filter "{ide/**}..." install --frozen-lockfile --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm -C ide download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      - name: Update electron-builder.yml for macos-15
        if: matrix.os == 'macos-15'
        run: |
          sed -i '' 's|https://yukibana.isc-vs.ch/download/latest/macos|https://yukibana.isc-vs.ch/download/latest/macos-arm|g' ide/electron/electron-builder.yml

      # Into the app's package.json, which electron-builder takes the app's version from.
      - name: Set the version
        shell: bash
        working-directory: ide/electron
        run: pnpm pkg set "version=$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build prod package
        shell: bash
        run: |
          pnpm -C ide package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ide/electron/dist/**
            !ide/electron/dist/*-unpacked/**
            !ide/electron/dist/mac/**
            !ide/electron/dist/mac-arm64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
