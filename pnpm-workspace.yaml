saveExact: true
# Resolves only versions at least 14 days old (in minutes), the same window as Dependabot's cooldown. It also applies to
# what the lockfile already holds: `pnpm install --frozen-lockfile` and `pnpm ci` refuse an entry younger than this.
# An exclusion (minimumReleaseAgeExclude) names each exact version, including the too-young dependencies it pulls in.
# The Node.js runtime of package.json's devEngines is not checked against it, which is why that names an exact version.
minimumReleaseAge: 20160
nodeLinker: hoisted # Needed for Theia's version check
# Warns, instead of installing every package, when a script runs on node_modules that don't match the lockfile: in a
# fresh clone, `pnpm setup:cli` would otherwise install the whole workspace before its own filtered install.
verifyDepsBeforeRun: warn
# What CI's plan (.github/scripts/plan.mts) leaves out of a package being changed, in `--filter "...[<base>]"`: a change to
# Markdown changes nothing, and a change to tests only affects the package they test, not the packages depending on it.
changedFilesIgnorePattern:
  - '**/*.md'
testPattern:
  - '**/tests/**'
  - '**/*.spec.ts'
  - '**/*.test.ts'
packages:
  - cloud/db
  - cloud/web
  - ide
  - ide/browser
  - ide/common
  - ide/e2e
  - ide/electron
  - ide/extensions/*
  - ide/extensions/langs/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@theia/ffmpeg': true
  '@vscode/windows-ca-certs': true
  drivelist: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  # Only needed by `theia test`, which this project doesn't use; skips downloading two Chrome builds.
  puppeteer: false
  # Download their binaries: the Supabase CLI, squawk, and the Workers runtime that wrangler runs locally.
  squawk-cli: true
  supabase: true
  workerd: true

# Every dependency of every package is named here, and only here, with its version (catalogMode: strict).
# electron cannot be specified as 'catalog:' because Theia's CLI checks its version using semver.
