appId: isc.yukibana
productName: Yukibana
copyright: Copyright © 2026-2026 ISC, HES-SO Valais/Wallis
electronDist: ../../node_modules/electron/dist
electronVersion: 42.8.1
asar: true
asarUnpack:
  - '**/lib/backend/native/**'
  - '**/lib/backend/shell-integrations/**'
  - '**/lib/prebuilds/**'
  - 'resources/icons/WindowIcon/512-512.png'
nodeGypRebuild: false
npmRebuild: false

# Where the installed app looks for updates (written into its app-update.yml): the GitHub release that GitHub marks
# latest, which release.yml makes the newest ide-v<version>, and its latest.yml or latest-linux.yml. Its files are
# fetched from that release's own tag, so electron-updater finds the installed version's blockmap in its release and
# downloads only the blocks that changed. electron-builder uploads nothing (ide/scripts/cli.mts passes --publish never);
# the release workflow does.
publish:
  provider: github
  owner: Yukibana-Ed
  repo: Yukibana

directories:
  buildResources: resources

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/icons/WindowIcon/512-512.png
  - resources/YukibanaSplash.svg
  - scripts
  - '!**node_modules/**'
extraResources:
  - from: ../plugins
    to: app/plugins

win:
  icon: resources/icons/WindowsLauncherIcons/Yukibana.ico
  target:
    - nsis
mac:
  icon: resources/icons/MacLauncherIcons/icon.icns
  category: public.app-category.developer-tools
  protocols:
    - name: theia
      schemes:
        - theia
  darkModeSupport: true
  target:
    - dmg
    - zip
  # With the architecture: the arm64 and the x64 build are attached to the same GitHub release.
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  # Otherwise the package's name, which as a scoped name (`@yukibana/ide-electron`) the AppImage and deb refuse. Also
  # the name after-pack.js wraps, and the same as package.json's desktopName.
  executableName: yukibana
  icon: resources/icons/LinuxLauncherIcons
  category: Development
  mimeTypes:
    - inode/directory
  vendor: ISC, HES-SO Valais/Wallis
  target:
    - deb
    - AppImage

nsis:
  # One click, per user, like Figma or VS Code's user installer: no wizard and no admin prompt; it installs into the
  # user's profile and opens the app. Per user is also what lets the app update itself without elevation, and
  # electron-updater only updates NSIS installs. The license page and the folder choice exist only in the wizard.
  oneClick: true
  perMachine: false
  menuCategory: true
  installerIcon: resources/icons/WindowsLauncherIcons/Yukibana.ico
  uninstallerIcon: resources/icons/WindowsLauncherIcons/Yukibana.ico
  installerHeaderIcon: resources/icons/WindowsLauncherIcons/Yukibana.ico
  runAfterFinish: true
  # Every installer's name carries its version, so that the files attached to one GitHub release say which they are.
  artifactName: ${productName}-Setup-${version}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

afterPack: ./scripts/after-pack.js
