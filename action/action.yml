# Publish this repository to Yukibana Cloud as a release: the starter
# students download and the teacher archive, built here by the CLI from the
# checked-out tree. Use it from a course repository, in one of two ways.
#
# Linked on the project page (Releases, Repository), with no secret: the job
# proves which repository and tag it runs at with GitHub's OIDC token, and
# publishes to every project linked to the repository. Only tags publish.
# A link is made by a project's owner, and the repository cannot remove it;
# a repository that wants a say gives `projects`, and a linked project it
# does not name (one linked by somebody who has since lost access to the
# repository, say) is then sent nothing.
#
#   on:
#     push:
#       tags: ['*']
#   permissions:
#     contents: read
#     id-token: write
#   ...
#     - uses: actions/checkout@v4
#     - uses: Yukibana-Ed/Yukibana/action@main
#       with:
#         url: https://yukibana.example.org
#         label: ${{ github.ref_name }}
#
# With a project token, made on the project page, which publishes to that
# project only, from any ref:
#
#     - uses: Yukibana-Ed/Yukibana/action@main
#       with:
#         url: https://yukibana.example.org
#         project: ${{ vars.YUKIBANA_PROJECT }}
#         token: ${{ secrets.YUKIBANA_TOKEN }}
#
# With neither `project` nor `token` (an empty one counts as not given), it
# publishes by the link; with either, by the token, as it always did.
name: Publish to Yukibana
description: Build the starter and teacher archives with the Yukibana CLI and upload them as a release.

inputs:
  url:
    description: The registry, like https://yukibana.example.org
    required: true
  project:
    description: The project id, from the project page; with `token`. Without either, the release goes by the link, to every linked project (or those `projects` names).
    required: false
    default: ''
  projects:
    description: Optional, without `project` and `token`. The ids of the linked projects this repository publishes to, separated by commas, spaces or new lines; when given, a linked project not named here is sent nothing. Empty publishes to every linked project.
    required: false
    default: ''
  token:
    description: A publishing token for that project; with `project`. Without either, the job publishes with its OIDC token and needs `permissions id-token write`.
    required: false
    default: ''
  directory:
    description: The project directory, when it is not the repository root
    default: '.'
  folder:
    description: What the archives unpack into; defaults to the repository name
    default: ''
  label:
    description: A label for the release; defaults to the short commit
    default: ''

runs:
  using: composite
  steps:
    # pnpm itself runs on this Node; the workspace's scripts run on the
    # release the root's devEngines names, which pnpm downloads.
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # The CLI is built from this action's own checkout, so a course
    # repository needs nothing published to npm.
    - name: Build the CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # The CLI and what it depends on in the workspace, nothing else, with
        # the pnpm the root's packageManager names. Installing compiles them
        # (their `prepare`).
        pnpm="$(node -p 'require(process.env.ACTION_PATH + "/../package.json").packageManager')"
        npx --yes "$pnpm" --dir "$ACTION_PATH/.." --filter @yukibana/cli... install --frozen-lockfile

    # Every input reaches the script through `env:` and is read as "$NAME".
    # An input is data (a label is often a tag name, which whoever can push
    # a tag chooses), and a `${{ }}` expression is pasted into the script's
    # text before bash parses it, so an input written that way would run as
    # code. Only `github.action_path`, which is this action's own checkout,
    # is ever an expression here, and it too goes through `env:`.
    - name: Publish
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        YUKIBANA_URL: ${{ inputs.url }}
        YUKIBANA_PROJECT: ${{ inputs.project }}
        YUKIBANA_TOKEN: ${{ inputs.token }}
        PROJECTS: ${{ inputs.projects }}
        LABEL: ${{ inputs.label }}
        FOLDER: ${{ inputs.folder }}
        DIRECTORY: ${{ inputs.directory }}
      run: |
        folder="$FOLDER"
        if [ -z "$folder" ]; then folder="${GITHUB_REPOSITORY##*/}"; folder="$(echo "$folder" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-')"; fi
        label="$LABEL"
        if [ -z "$label" ]; then label="${GITHUB_SHA::12}"; fi
        cli="$ACTION_PATH/../packages/cli/lib/index.js"
        if [ -z "$YUKIBANA_TOKEN" ] && [ -z "$YUKIBANA_PROJECT" ]; then
          # By the repository's link. The CLI asks GitHub for a token itself,
          # and says the same when it cannot; this says it first, in the
          # job's annotations, where a teacher looks.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error title=Yukibana::No project token was given, so this publishes by the repository's link, which needs GitHub's OIDC token. Add 'permissions: id-token: write' to the workflow (or to this job), or give the action 'project' and 'token'."
            exit 1
          fi
          if [ -n "$PROJECTS" ]; then
            node "$cli" publish "$DIRECTORY" --ci --projects "$PROJECTS" --folder "$folder" --label "$label"
          else
            node "$cli" publish "$DIRECTORY" --ci --folder "$folder" --label "$label"
          fi
        else
          # With a token, exactly as before links existed: the project is
          # `project`, else the projectId in yukibana.json, and an empty
          # secret is reported by the CLI as a missing token.
          node "$cli" publish "$DIRECTORY" --folder "$folder" --label "$label"
        fi
